name: Lixinger 65-field capability test

on:
  push:
    branches:
      - research/screw-star-replica
    paths:
      - ".github/workflows/lixinger-65-field-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/screw-star-replica

      - name: Test 65 metrics in one 10-year request
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          outdir = Path("data/derived/lixinger")
          outdir.mkdir(parents=True, exist_ok=True)
          summary_path = outdir / "index_fundamental_65_field_test_summary.json"
          raw_path = outdir / "index_fundamental_000985_20160919_20260918.json"

          metrics = []
          for name in ["pe_ttm", "pb", "ps_ttm", "dyr"]:
              for kind in ["mcw", "ew", "ewpvo", "avg", "median"]:
                  metrics.append(f"{name}.{kind}")

          metrics += [
              "tv", "ta", "to_r", "cp", "cpc", "cpa", "r_cp", "r_cpc",
              "mc", "mc_om", "cmc", "ecmc",
              "fpa", "fra", "fnpa", "fb",
              "ssa", "sra", "snsa", "sb",
              "ha_shm", "mm_nba", "fet_as_ma", "fet_snif_ma", "launchDate",
          ]

          for name in ["pe_ttm", "pb"]:
              for granularity in ["y20", "fs"]:
                  for kind in ["mcw", "ew", "ewpvo", "avg", "median"]:
                      metrics.append(f"{name}.{granularity}.{kind}.cvpos")

          assert len(metrics) == 65, len(metrics)

          summary = {
              "tested_at_utc": datetime.now(timezone.utc).isoformat(),
              "endpoint": "https://open.lixinger.com/api/cn/index/fundamental",
              "stockCodes": ["000985"],
              "startDate": "2016-09-19",
              "endDate": "2026-09-18",
              "requested_metric_count": len(metrics),
              "requested_metrics": metrics,
          }

          token = os.environ.get("LIXINGER_TOKEN", "").strip()
          if not token:
              summary.update({
                  "test_executed": False,
                  "success": False,
                  "reason": "LIXINGER_TOKEN secret is not configured in this repository",
              })
              summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
              raise SystemExit(0)

          payload = {
              "stockCodes": ["000985"],
              "startDate": "2016-09-19",
              "endDate": "2026-09-18",
              "metricsList": metrics,
              "token": token,
          }
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              summary["endpoint"],
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "ArticleAnalysis/1.0"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=180) as resp:
                  response_text = resp.read().decode("utf-8")
                  http_status = resp.status
              data = json.loads(response_text)
              summary["http_status"] = http_status
              summary["api_code"] = data.get("code")
              summary["api_message"] = data.get("message")
              summary["test_executed"] = True
              summary["success"] = bool(http_status == 200 and data.get("code") == 1)

              rows = data.get("data") or []
              summary["row_count"] = len(rows)
              union = set()
              for row in rows:
                  union.update(row.keys())
              returned_metrics = sorted((union - {"date", "stockCode"}) & set(metrics))
              missing = sorted(set(metrics) - union)
              summary["returned_requested_metric_count"] = len(returned_metrics)
              summary["returned_requested_metrics"] = returned_metrics
              summary["missing_requested_metrics"] = missing
              if rows:
                  summary["first_response_date"] = rows[-1].get("date")
                  summary["last_response_date"] = rows[0].get("date")

              # Token is only in the request body and is never saved.
              raw_path.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")

          except urllib.error.HTTPError as e:
              err = e.read().decode("utf-8", errors="replace")
              summary.update({
                  "test_executed": True,
                  "success": False,
                  "http_status": e.code,
                  "error_body": err[:4000],
              })
          except Exception as e:
              summary.update({
                  "test_executed": True,
                  "success": False,
                  "exception": repr(e),
              })

          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Commit test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/lixinger/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "research: test Lixinger 65-field request"
            git push origin HEAD:research/screw-star-replica
          fi
